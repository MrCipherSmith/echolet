name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Typecheck, Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build CLI & Web Bundle
        run: pnpm --filter @goodea/echolet run prepublishOnly

      - name: Run Tests (Vitest)
        run: pnpm run test

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/relay/go.mod'
          check-latest: false
          cache: false

      - name: Run Go Tests (Relay)
        run: go test -v ./apps/relay/...
