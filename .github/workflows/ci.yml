name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Typecheck, Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Build only. prepublishOnly also runs the whole CLI suite, which would run
      # it a second time in this job and double the exposure to the flake above.
      - name: Build CLI & Web Bundle
        run: |
          pnpm --filter @goodea/echolet run bundle:web
          pnpm --filter @goodea/echolet run build

      # The push gate's JS step, not a bare `pnpm run test`: vitest 3.0.8 drops
      # whole test-file reports when a starved worker misses its hardcoded 60 s
      # onTaskUpdate RPC deadline (exit 1 with zero failing tests). The gate runs
      # the suite exactly as before, then re-runs only the files that never
      # reported, serially, and requires them green. A real failure still fails.
      # See .metaproject/memory/constraints/vitest-3-0-8-loses-whole-test-file-reports-under-load.md
      - name: Run Tests (Vitest)
        run: sh scripts/gate/js-suite.sh "$GITHUB_WORKSPACE" ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/relay/go.mod'
          check-latest: false
          cache: false

      - name: Run Go Tests (Relay)
        run: go -C apps/relay test -v ./...
